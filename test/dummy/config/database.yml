default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  username: <%= ENV["PGUSER"] %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: weirdy_development

test:
  <<: *default
  database: weirdy_test

production:
  <<: *default
  database: weirdy_production
